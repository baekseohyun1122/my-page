  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">

  <style>
    /* Global & Theme Settings */
    :root {
      --bg-gradient: linear-gradient(135deg, #fff5f7 0%, #fff0f5 50%, #f0f7ff 100%);
      --card-bg: #ffffff;
      --pink-primary: #ffb7c5;
      --pink-soft: #ffe4e8;
      --mint-primary: #b2ebd9;
      --yellow-primary: #fff2b2;
      --purple-primary: #e2c0ff;
      --text-main: #5a4b51;
      --text-muted: #8c7b83;
      --shadow: 0 10px 25px rgba(230, 180, 200, 0.3);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Gowun Dodum', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 60px;
    }

    h1, h2, h3, .font-cute {
      font-family: 'Gaegu', cursive;
    }

    /* Container */
    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Sparkle Trail Effect */
    .sparkle {
      position: absolute;
      pointer-events: none;
      background: radial-gradient(circle, #fff 20%, var(--pink-primary) 70%, transparent 100%);
      border-radius: 50%;
      animation: floatFade 1s forwards ease-out;
      z-index: 9999;
    }

    @keyframes floatFade {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.8) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -80px) scale(0.1) rotate(180deg);
      }
    }

    /* Header Profile Section */
    .header-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border-radius: var(--radius);
      padding: 30px 20px;
      text-align: center;
      box-shadow: var(--shadow);
      border: 3px solid #ffffff;
      margin-top: 20px;
      margin-bottom: 30px;
      position: relative;
      overflow: hidden;
    }

    .header-card::before {
      content: '✨';
      position: absolute;
      top: 15px;
      left: 20px;
      font-size: 1.5rem;
    }

    .header-card::after {
      content: '🧁';
      position: absolute;
      bottom: 15px;
      right: 20px;
      font-size: 1.8rem;
    }

    .avatar-wrapper {
      width: 110px;
      height: 110px;
      margin: 0 auto 15px;
      background: linear-gradient(135deg, var(--pink-soft), var(--yellow-primary));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      box-shadow: 0 8px 15px rgba(255, 183, 197, 0.4);
      border: 4px solid #fff;
      animation: pulse 3s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .nickname {
      font-size: 2.8rem;
      color: #ff6f91;
      margin-bottom: 5px;
      letter-spacing: 1px;
    }

    .tagline {
      color: var(--text-muted);
      font-size: 1.05rem;
      background: #fff;
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    /* Section Styling */
    .section-title {
      font-size: 2.2rem;
      text-align: center;
      margin: 35px 0 20px;
      color: #4a3e3d;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* Flip Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
    }

    .flip-card {
      background-color: transparent;
      height: 220px;
      perspective: 1000px;
      cursor: pointer;
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .flip-card.flipped .flip-card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      border: 3px solid #ffffff;
    }

    .card-front {
      background: linear-gradient(145deg, #ffffff, #fff5f8);
    }

    .card-front .icon {
      font-size: 3.5rem;
      margin-bottom: 10px;
      transition: transform 0.3s;
    }

    .flip-card:hover .card-front .icon {
      transform: scale(1.15) rotate(5deg);
    }

    .card-front .title {
      font-family: 'Gaegu', cursive;
      font-size: 1.6rem;
      color: #ff6f91;
      font-weight: bold;
    }

    .card-front .hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 8px;
      background: rgba(255,183,197,0.2);
      padding: 3px 10px;
      border-radius: 10px;
    }

    .card-back {
      transform: rotateY(180deg);
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }

    .card-back.cat-bg { background: linear-gradient(135deg, #ffb3ba, #ffdfba); }
    .card-back.art-bg { background: linear-gradient(135deg, #baffc9, #bae1ff); }
    .card-back.ramen-bg { background: linear-gradient(135deg, #ffffba, #ffb3ba); color: #5a4b51; text-shadow: none; }

    .card-back h4 {
      font-family: 'Gaegu', cursive;
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    .card-back p {
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: keep-all;
    }

    /* OX Quiz Section */
    .quiz-card {
      background: #ffffff;
      border-radius: var(--radius);
      padding: 25px 20px;
      box-shadow: var(--shadow);
      text-align: center;
      border: 3px solid #ffffff;
      position: relative;
    }

    .quiz-question {
      font-size: 1.25rem;
      margin-bottom: 20px;
      font-weight: 500;
    }

    .quiz-options {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .btn-quiz {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: none;
      font-size: 2.2rem;
      font-family: 'Gaegu', cursive;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 6px 12px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-o {
      background: var(--pink-soft);
      color: #ff477e;
    }

    .btn-x {
      background: #eef2ff;
      color: #4ea8de;
    }

    .btn-quiz:hover {
      transform: translateY(-4px) scale(1.05);
    }

    .btn-quiz:active {
      transform: translateY(1px);
    }

    /* Quiz Result Overlay Inside Box */
    .quiz-result {
      margin-top: 20px;
      padding: 12px;
      border-radius: 16px;
      font-family: 'Gaegu', cursive;
      font-size: 1.4rem;
      display: none;
      animation: popIn 0.3s ease-out;
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .quiz-result.correct {
      background-color: #e8f5e9;
      color: #2e7d32;
      border: 2px dashed #a5d6a7;
    }

    .quiz-result.wrong {
      background-color: #ffebee;
      color: #c62828;
      border: 2px dashed #ef9a9a;
    }

    /* Fortune Teller Section */
    .fortune-card {
      background: linear-gradient(135deg, #ffffff 0%, #fef4ff 100%);
      border-radius: var(--radius);
      padding: 30px 20px;
      text-align: center;
      box-shadow: var(--shadow);
      border: 3px solid #ffffff;
    }

    .btn-fortune {
      background: linear-gradient(135deg, var(--purple-primary), var(--pink-primary));
      color: #fff;
      border: none;
      padding: 14px 28px;
      font-size: 1.3rem;
      font-family: 'Gaegu', cursive;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(226, 192, 255, 0.6);
      transition: all 0.2s;
    }

    .btn-fortune:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(226, 192, 255, 0.8);
    }

    .btn-fortune:active {
      transform: translateY(1px);
    }

    .fortune-display {
      margin-top: 25px;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      border-radius: 18px;
      padding: 15px;
      border: 2px solid var(--pink-soft);
      font-size: 1.1rem;
      line-height: 1.5;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
      word-break: keep-all;
    }

    .fortune-placeholder {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Confetti Burst (CSS) */
    .confetti-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 10000;
      overflow: hidden;
    }

    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 10px;
      top: -20px;
      animation: fall 2.5s linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(720deg);
        opacity: 0;
      }
    }

    /* Footer */
    footer {
      text-align: center;
      margin-top: 40px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Mobile Adaptations */
    @media (max-width: 480px) {
      .container { padding: 12px; }
      .nickname { font-size: 2.3rem; }
      .cards-grid { grid-template-columns: 1fr; }
      .flip-card { height: 180px; }
      .section-title { font-size: 1.8rem; }
    }
  </style>

<script data-studio="js">
(function () {
    function each(sel, fn) { Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
    each('[data-st="tabs"]', function (t) {
      var bs = t.querySelectorAll('.st-tab'), ps = t.querySelectorAll('.st-tab-panel');
      function show(i) { bs.forEach(function (b, k) { b.classList.toggle('is-on', k === i); b.setAttribute('aria-selected', k === i); }); ps.forEach(function (p, k) { p.hidden = k !== i; }); }
      bs.forEach(function (b, i) { b.addEventListener('click', function () { show(i); }); });
      show(0);
    });
    each('[data-st-open]', function (b) { b.addEventListener('click', function () { var d = document.getElementById(b.getAttribute('data-st-open')); if (d && d.showModal) d.showModal(); }); });
    each('dialog.st-modal', function (d) { d.addEventListener('click', function (e) { if (e.target === d || e.target.closest('[data-st-close]')) d.close(); }); });
    each('[data-st="slider"]', function (s) {
      var tr = s.querySelector('.st-slides'), dots = s.querySelector('.st-dots'), i = 0, n = tr.children.length;
      function paint() { if (dots) Array.prototype.forEach.call(dots.children, function (d, k) { d.classList.toggle('is-on', k === i); }); }
      function go(k) { i = (k + n) % n; tr.scrollTo({ left: tr.clientWidth * i, behavior: 'smooth' }); paint(); }
      if (dots) { dots.innerHTML = ''; for (var k = 0; k < n; k++) (function (k) { var d = document.createElement('button'); d.type = 'button'; d.setAttribute('aria-label', (k + 1) + '번째 사진'); d.addEventListener('click', function () { go(k); }); dots.appendChild(d); })(k); }
      var pv = s.querySelector('.st-prev'), nx = s.querySelector('.st-next');
      if (pv) pv.addEventListener('click', function () { go(i - 1); });
      if (nx) nx.addEventListener('click', function () { go(i + 1); });
      tr.addEventListener('scroll', function () { var k = Math.round(tr.scrollLeft / (tr.clientWidth || 1)); if (k !== i) { i = k; paint(); } });
      paint();
    });
    each('[data-st="quiz"]', function (q) {
      var r = q.querySelector('.st-qr'), os = q.querySelectorAll('.st-opt');
      os.forEach(function (o) { o.addEventListener('click', function () { var ok = o.hasAttribute('data-ok'); os.forEach(function (x) { x.classList.remove('is-ok', 'is-no'); }); o.classList.add(ok ? 'is-ok' : 'is-no'); if (r) r.textContent = ok ? (q.getAttribute('data-ok-msg') || '정답이에요!') : (q.getAttribute('data-no-msg') || '다시 생각해 봐요.'); }); });
    });
    each('[data-st="check"]', function (c, ci) {
      var bs = c.querySelectorAll('input[type=checkbox]'), out = c.querySelector('.st-cnt'), bar = c.querySelector('.st-bar i'), key = 'st-check-' + location.pathname + '-' + ci, sv = {};
      try { sv = JSON.parse(localStorage.getItem(key) || '{}') || {}; } catch (e) {}
      function up() { var d = 0; bs.forEach(function (b) { if (b.checked) d++; }); if (out) out.textContent = d + ' / ' + bs.length + ' 완료'; if (bar) bar.style.width = (bs.length ? d / bs.length * 100 : 0) + '%'; }
      bs.forEach(function (b, i) { b.checked = !!sv[i]; b.addEventListener('change', function () { sv[i] = b.checked; try { localStorage.setItem(key, JSON.stringify(sv)); } catch (e) {} up(); }); });
      up();
    });
    each('[data-st="dday"]', function (e) {
      var o = e.querySelector('.st-dnum'), t = new Date(e.getAttribute('data-date') + 'T00:00:00'), now = new Date(); now.setHours(0, 0, 0, 0);
      var d = Math.round((t - now) / 864e5); if (o) o.textContent = isNaN(d) ? '날짜를 정해요' : d > 0 ? 'D-' + d : d === 0 ? 'D-DAY' : 'D+' + (-d);
    });
    each('[data-st="timer"]', function (e) {
      var m = +e.getAttribute('data-min') || 25, left = m * 60, id = 0, o = e.querySelector('.st-tnum'), go = e.querySelector('.st-tgo'), rs = e.querySelector('.st-trs');
      function p() { o.textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0'); }
      function stop() { clearInterval(id); id = 0; go.textContent = '시작'; }
      go.addEventListener('click', function () { if (id) { stop(); return; } o.classList.remove('is-done'); id = setInterval(function () { if (left > 0) { left--; p(); } if (left <= 0) { stop(); o.classList.add('is-done'); } }, 1000); go.textContent = '잠시 멈춤'; });
      rs.addEventListener('click', function () { stop(); left = m * 60; o.classList.remove('is-done'); p(); });
      p();
    });
    each('[data-st="dark"]', function (b) {
      try { if (localStorage.getItem('st-dark') === '1') document.documentElement.classList.add('st-dark'); } catch (e) {}
      b.addEventListener('click', function () { var on = document.documentElement.classList.toggle('st-dark'); try { localStorage.setItem('st-dark', on ? '1' : '0'); } catch (e) {} });
    });
    // 스크롤 등장 효과: 화면에 들어오면 나타남 (지원하지 않는 브라우저·움직임 줄이기 설정에서는 그냥 보임)
    var ins = document.querySelectorAll('[data-st-in]');
    if (ins.length && 'IntersectionObserver' in window && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) {
      document.documentElement.classList.add('st-js');
      var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); } }); }, { threshold: 0.08 });
      Array.prototype.forEach.call(ins, function (e) { io.observe(e); });
    }
  })();
</script>
